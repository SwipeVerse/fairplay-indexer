    name: ProfileRegistry
    network: scroll-sepolia
    source:
      address: "0x83dC15848AaE643B60849cEE4aF9AdF1B5935747"
      abi: ProfileRegistry
      startBlock: 10441466
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - ProfileMinted
      abis:
        - name: ProfileRegistry
          file: ./abis/ProfileRegistry.json
      eventHandlers:
        - event: ProfileMinted(indexed address,string,string)
          handler: handleProfileMinted
      file: ./src/profile-registry.ts
