type AddUser @entity(immutable: true) {
  id: Bytes!
  player_addr: Bytes! # address
  name: String! # string
  dob: BigInt! # uint256
  gender: Int! # uint8
  location: BigInt! # uint256
  uri: String! # string
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

type ProfileMinted @entity(immutable: true) {
  id: Bytes!
  user: Bytes! # address
  ipfsURI: String! # string
  publicKey: String! # string
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}
